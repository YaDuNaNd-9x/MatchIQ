services:
  db:
    image: postgres:17-alpine
    container_name: matchiq-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matchiq_db}
      POSTGRES_USER: ${POSTGRES_USER:-matchiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matchiq_local_dev_2026}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: